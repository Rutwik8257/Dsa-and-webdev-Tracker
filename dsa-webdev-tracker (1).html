<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&gt;_ progress — DSA + WebDev tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13;
  --surface:#12151c;
  --surface-2:#181c25;
  --surface-3:#1e232e;
  --border:#252a35;
  --border-soft:#1a1e28;
  --text:#e7e9ee;
  --text-dim:#9298a6;
  --text-faint:#5b6170;
  --amber:#f0a94e;
  --amber-dim:#7a5a2c;
  --teal:#4fd1c5;
  --green:#3ecf8e;
  --yellow:#f0c34e;
  --red:#f0685e;
  --green-bg:rgba(62,207,142,.12);
  --yellow-bg:rgba(240,195,78,.12);
  --red-bg:rgba(240,104,94,.12);
  --amber-bg:rgba(240,169,78,.12);
  --radius:10px;
  --radius-sm:6px;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --display:'Space Grotesk', sans-serif;
  --body:'Inter', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber);color:#1a1206;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:216px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border-soft);
  padding:20px 12px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  font-family:var(--mono);font-size:13px;color:var(--amber);
  padding:0 10px 18px;display:flex;align-items:center;gap:8px;letter-spacing:.02em;
}
.brand .cursor{width:7px;height:14px;background:var(--amber);display:inline-block;animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.navgroup-label{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 6px;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:13px;font-weight:500;background:none;border:none;text-align:left;width:100%;
  transition:background .12s,color .12s;
}
.navitem:hover{background:var(--surface-2);color:var(--text);}
.navitem.active{background:var(--surface-3);color:var(--amber);}
.navitem .ic{width:16px;text-align:center;font-size:14px;opacity:.85;}
.sidebar-footer{margin-top:auto;padding:12px 10px 0;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);border-top:1px solid var(--border-soft);padding-top:12px;}
.sidebar-footer.status-error{color:var(--red);}
.sidebar-footer:hover{color:var(--amber);}

.main{flex:1;min-width:0;padding:28px 34px 60px;max-width:1180px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.page-title{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;}
.page-sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;}
.card + .card{margin-top:14px;}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}.main{padding:18px 16px 60px;}.app{flex-direction:column;}.sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:12px;}
  .brand{display:none;}.navgroup-label{display:none;}.navitem{width:auto;padding:6px 10px;}.sidebar-footer{order:99;width:auto;margin-left:auto;border-top:none;padding-top:6px;}}

.stat{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;}
.stat .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);}
.stat .value{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--text);}
.stat .value.amber{color:var(--amber);}
.stat .value.green{color:var(--green);}
.stat .sub{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

.bar-track{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease;background:var(--amber);}
.bar-fill.green{background:var(--green);}
.bar-fill.teal{background:var(--teal);}
.bar-fill.red{background:var(--red);}
.bar-fill.yellow{background:var(--yellow);}
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;}
.bar-row .bar-label{width:118px;flex-shrink:0;font-size:12.5px;color:var(--text-dim);}
.bar-row .bar-track{flex:1;}
.bar-row .bar-pct{width:40px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text-dim);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;font-family:var(--mono);white-space:nowrap;}
.pill.notstarted{background:var(--surface-3);color:var(--text-faint);}
.pill.partial{background:var(--yellow-bg);color:var(--yellow);}
.pill.completed{background:var(--green-bg);color:var(--green);}
.pill.independent{background:var(--green-bg);color:var(--green);}
.pill.hint{background:var(--yellow-bg);color:var(--yellow);}
.pill.full{background:var(--red-bg);color:var(--red);}
.pill.weak-low{background:var(--green-bg);color:var(--green);}
.pill.weak-med{background:var(--yellow-bg);color:var(--yellow);}
.pill.weak-high{background:var(--red-bg);color:var(--red);}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);color:var(--text);
  border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--text-faint);}
.btn.primary{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600;}
.btn.primary:hover{background:#f5b65f;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{color:var(--text);background:var(--surface-2);}
.btn.danger{color:var(--red);}
.btn.small{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.section-title{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:2px;}
.section-flex{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto;}
.tname{font-weight:600;}
.tmuted{color:var(--text-dim);}
.tfaint{color:var(--text-faint);font-size:12px;}

input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;
}
textarea{resize:vertical;min-height:60px;}
label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
.field{margin-bottom:12px;}
.checkline{display:flex;align-items:center;gap:8px;}
.checkline input{width:16px;height:16px;accent-color:var(--amber);}

.empty{padding:30px 10px;text-align:center;color:var(--text-faint);font-size:13px;}
.empty .big{font-size:24px;margin-bottom:6px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,6,9,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;padding:22px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{font-family:var(--display);font-size:16px;font-weight:600;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.hidden{display:none !important;}

/* dashboard specific */
.terminal{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px 22px;font-family:var(--mono);}
.term-line{color:var(--text-dim);font-size:12.5px;}
.term-line .prompt{color:var(--amber);}
.term-line .val{color:var(--text);}
.hero-date{font-family:var(--display);font-size:26px;font-weight:600;margin:4px 0 2px;}
.hero-overall{display:flex;align-items:baseline;gap:10px;margin-top:14px;}
.hero-overall .num{font-family:var(--mono);font-size:44px;font-weight:600;color:var(--amber);line-height:1;}
.hero-overall .lbl{color:var(--text-dim);font-size:12.5px;}

.streak-strip{display:flex;gap:3px;align-items:flex-end;margin-top:10px;}
.streak-cell{width:9px;height:16px;border-radius:2px;background:var(--surface-3);}
.streak-cell.hit{background:var(--amber);}

.schedule-block{border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 16px;}
.schedule-block .sh-head{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13.5px;margin-bottom:10px;}
.topic-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);}
.topic-row:last-child{border-bottom:none;}
.topic-row .tn{font-size:13px;}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;}
.status-dot.notstarted{background:var(--text-faint);}
.status-dot.partial{background:var(--yellow);}
.status-dot.completed{background:var(--green);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);margin-bottom:16px;overflow-x:auto;}
.tab-btn{padding:9px 14px;font-size:13px;color:var(--text-dim);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}

.progress-mini{width:60px;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{font-family:var(--mono);font-size:10px;color:var(--text-faint);text-align:center;padding-bottom:4px;text-transform:uppercase;}
.cal-cell{aspect-ratio:1;border-radius:6px;background:var(--surface-2);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text-dim);cursor:pointer;position:relative;}
.cal-cell:hover{border-color:var(--text-faint);}
.cal-cell.empty-cell{background:transparent;border:none;cursor:default;}
.cal-cell.good{background:var(--green-bg);color:var(--green);border-color:transparent;}
.cal-cell.partial{background:var(--yellow-bg);color:var(--yellow);border-color:transparent;}
.cal-cell.missed{background:var(--red-bg);color:var(--red);border-color:transparent;}
.cal-cell.today-cell{box-shadow:0 0 0 2px var(--amber) inset;}

.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border-soft);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-dim);}
.kv .v{font-family:var(--mono);font-weight:500;}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:3px 10px;font-size:11.5px;color:var(--text-dim);}

.feature-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;}
.feature-item input{width:15px;height:15px;accent-color:var(--green);}
.feature-item.done .ftxt{text-decoration:line-through;color:var(--text-faint);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--surface-3);border:1px solid var(--border);padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.icon-btn{background:none;border:none;color:var(--text-faint);padding:4px 6px;border-radius:4px;font-size:13px;}
.icon-btn:hover{color:var(--text);background:var(--surface-3);}

.divider{height:1px;background:var(--border-soft);margin:16px 0;}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--text-dim);font-size:13px;z-index:999;}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">initializing tracker<span class="cursor" style="display:inline-block;width:7px;height:13px;background:var(--amber);margin-left:6px;animation:blink 1s steps(1) infinite;"></span></div>

<div class="app hidden" id="app">
  <nav class="sidebar">
    <div class="brand"><span>&gt;_ progress</span><span class="cursor"></span></div>
    <div class="navgroup-label">Overview</div>
    <button class="navitem" data-tab="dashboard"><span class="ic">◈</span> Dashboard</button>
    <button class="navitem" data-tab="analytics"><span class="ic">▤</span> Analytics</button>
    <button class="navitem" data-tab="calendar"><span class="ic">▦</span> Calendar</button>
    <div class="navgroup-label">DSA</div>
    <button class="navitem" data-tab="topics"><span class="ic">◆</span> Topics</button>
    <button class="navitem" data-tab="schedule"><span class="ic">≣</span> Schedule</button>
    <button class="navitem" data-tab="problems"><span class="ic">▣</span> Problems</button>
    <button class="navitem" data-tab="revisit"><span class="ic">↺</span> Revisit</button>
    <div class="navgroup-label">Web Dev</div>
    <button class="navitem" data-tab="webdev"><span class="ic">◇</span> Topics</button>
    <button class="navitem" data-tab="projects"><span class="ic">▧</span> Projects</button>
    <div class="navgroup-label">Journal</div>
    <button class="navitem" data-tab="log"><span class="ic">✎</span> Daily Log</button>
    <button class="sidebar-footer" id="storageStatus" data-action="retry-sync" style="cursor:pointer;background:none;border:none;text-align:left;width:100%;">synced ✓</button>
    <div style="display:flex;gap:4px;padding:8px 10px 0;">
      <button class="btn ghost small" style="flex:1;font-size:11px;padding:5px 6px;" data-action="export-data" title="Download your data as a JSON file">⬇ Export</button>
      <button class="btn ghost small" style="flex:1;font-size:11px;padding:5px 6px;" data-action="import-data" title="Load data from a JSON file">⬆ Import</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;">
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";

/* ============================= CONFIG ============================= */
// Fill these in after you deploy the backend (see tracker-backend/README.md).
// Leave API_BASE_URL empty to fall back to Claude's built-in artifact storage instead.
const CONFIG = {
  API_BASE_URL: "",   // e.g. "https://your-app.onrender.com"
  API_KEY: ""         // the same random string you set as API_KEY on your host
};

/* ============================= CONSTANTS ============================= */
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW_SHORT = ["S","M","T","W","T","F","S"];
const STORAGE_KEY = "dsa_webdev_tracker_state_v1";

const DEFAULT_DSA_TOPICS = ["Arrays","Strings","Linked List","Stack","Queue","Hashing","Sorting",
  "Binary Search","Recursion","Backtracking","Trees","BST","Heap","Graphs","Greedy","Dynamic Programming","Trie"];

const DEFAULT_WEBDEV_TOPICS = ["HTML","CSS","JavaScript","React","Node.js","Express","Databases",
  "Authentication","REST APIs","Git","Deployment","TypeScript"];

const DEFAULT_SCHEDULE = {
  Monday:["Arrays","Strings","Linked List"],
  Tuesday:["Stack","Hashing","Sorting"],
  Wednesday:["Backtracking","BST","Heap"],
  Thursday:["Queue","Binary Search","Recursion","Trees"],
  Friday:["Heap","Graphs","Greedy"],
  Saturday:["Dynamic Programming","Trie","Graphs"],
  Sunday:["Revision","Weak topics","Mixed problems"]
};

const AI_USAGE_OPTIONS = ["No AI","Used AI for explanation","Used AI for debugging","Used AI for code review","Used AI for optimization","Used AI to generate code"];

/* ============================= UTIL ============================= */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayISO(){ const d=new Date(); return isoFromDate(d); }
function isoFromDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${dd}`; }
function dowName(iso){ const d=new Date(iso+"T00:00:00"); return DOW[d.getDay()]; }
function fmtDateLong(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
function fmtDateShort(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function pct(n,d){ if(!d) return 0; return Math.round((n/d)*100); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return isoFromDate(d); }

function toast(msg){
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}

/* ============================= STATE ============================= */
let state = null;
let saveTimer = null;

function defaultState(){
  return {
    version: 1,
    topics: DEFAULT_DSA_TOPICS.map(name => ({
      id: uid(), name, weakness: "med", notes: "",
      attempted:0, independent:0, hint:0, full:0,
      lastRevised: null, nextRevision: null
    })),
    schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
    problems: [],
    webdevTopics: DEFAULT_WEBDEV_TOPICS.map(name => ({
      id: uid(), name, learned:false, practiced:false, built:false,
      confidence:2, notes:"", lastPracticed:null, nextRevision:null
    })),
    projects: [],
    dailyLogs: {},
    ui: { lastTab:"dashboard" }
  };
}

function ensureDay(iso){
  if(!state.dailyLogs[iso]){
    state.dailyLogs[iso] = {
      date: iso,
      morning: { hours:0, entries:[] },
      afternoon: { hours:0, entries:[] },
      night: { hours:0, webdevTopic:"", built:"", aiUsage:"No AI", notes:"", entries:[] },
      reflection: { learned:"", difficult:"", revisit:"", tomorrow:"" }
    };
  }
  return state.dailyLogs[iso];
}

function scheduleFor(iso){
  const dn = dowName(iso);
  return state.schedule[dn] || [];
}

function topicStatusForDay(topicName, iso){
  const day = state.dailyLogs[iso];
  if(!day) return "notstarted";
  const all = [...day.morning.entries, ...day.afternoon.entries];
  const matches = all.filter(e => e.topicName === topicName);
  if(matches.length === 0) return "notstarted";
  const anyIndependent = matches.some(e => e.revised && e.independent > 0);
  if(anyIndependent) return "completed";
  return "partial";
}

/* ---- persistence: MongoDB API (preferred) with Claude artifact storage as fallback ---- */
async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function usingApi(){ return !!CONFIG.API_BASE_URL; }
function apiHeaders(){
  const h = { "Content-Type": "application/json" };
  if(CONFIG.API_KEY) h["x-api-key"] = CONFIG.API_KEY;
  return h;
}
function normalizeLoadedState(parsed){
  state = Object.assign(defaultState(), parsed);
  if(!state.schedule) state.schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
  if(!state.dailyLogs) state.dailyLogs = {};
  if(!state.ui) state.ui = {lastTab:"dashboard"};
}

async function loadState(){
  if(usingApi()){
    for(let attempt=1; attempt<=3; attempt++){
      try{
        const res = await fetch(`${CONFIG.API_BASE_URL}/api/state`, { headers: apiHeaders() });
        if(!res.ok){
          const body = await res.text().catch(()=> "");
          throw new Error(`API responded ${res.status}: ${body}`);
        }
        const json = await res.json();
        if(json.data){ normalizeLoadedState(json.data); } else { state = defaultState(); }
        setStorageStatus("synced ✓ (db)");
        return;
      }catch(e){
        console.warn(`DB load attempt ${attempt} failed:`, e);
        if(attempt < 3){ await sleep(500 * attempt); continue; }
        setStorageStatus("db offline — retry ⟳");
        toast("⚠ Could not reach your database. Using an unsaved local session until it reconnects — export a backup before closing the tab.");
      }
    }
    state = defaultState();
    return;
  }

  // Fallback: Claude's built-in artifact storage.
  for(let attempt=1; attempt<=3; attempt++){
    try{
      if(!window.storage) break;
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        normalizeLoadedState(JSON.parse(res.value));
        setStorageStatus("synced ✓");
        return;
      }
      setStorageStatus("synced ✓");
      state = defaultState();
      return;
    }catch(e){
      console.warn(`Storage load attempt ${attempt} failed:`, e);
      if(attempt < 3){ await sleep(500 * attempt); continue; }
      setStorageStatus("offline — retry ⟳");
      toast("Couldn't reach saved data — starting fresh locally. Click \"retry ⟳\" in the sidebar, or set up your own database (see CONFIG at the top of the file).");
    }
  }
  state = defaultState();
}

function setStorageStatus(txt){
  const el = document.getElementById("storageStatus");
  if(el){
    el.textContent = txt;
    el.classList.toggle("status-error", txt.indexOf("offline")===0 || txt.indexOf("db offline")===0 || txt.indexOf("failed")>=0);
  }
}

function saveState(){
  setStorageStatus("saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> attemptSave(1), 350);
}

async function attemptSave(attempt){
  try{
    if(usingApi()){
      const res = await fetch(`${CONFIG.API_BASE_URL}/api/state`, {
        method: "PUT",
        headers: apiHeaders(),
        body: JSON.stringify({ data: state })
      });
      if(!res.ok){
        const body = await res.text().catch(()=> "");
        throw new Error(`API responded ${res.status}: ${body}`);
      }
      setStorageStatus("synced ✓ (db)");
      return;
    }
    if(window.storage){
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      if(!res) throw new Error("Storage set returned null");
    }
    setStorageStatus("synced ✓");
  }catch(e){
    console.error(`Save attempt ${attempt} failed:`, e);
    if(attempt < 3){
      await sleep(600 * attempt);
      return attemptSave(attempt+1);
    }
    setStorageStatus(usingApi() ? "db offline — retry ⟳" : "save failed — retry ⟳");
    toast("⚠ Couldn't save. Your changes are still on screen — click \"retry ⟳\" in the sidebar, or export a backup before closing this tab.");
  }
}

/* ============================= COMPUTATIONS ============================= */
function computeStreaks(){
  const dates = Object.keys(state.dailyLogs).sort();
  const studied = new Set();
  const dsaDays = new Set();
  const webdevDays = new Set();
  dates.forEach(iso=>{
    const d = state.dailyLogs[iso];
    const hrs = (d.morning.hours||0)+(d.afternoon.hours||0)+(d.night.hours||0);
    const hasDsa = d.morning.entries.length>0 || d.afternoon.entries.length>0 || d.morning.hours>0 || d.afternoon.hours>0;
    const hasWebdev = d.night.entries.length>0 || (d.night.webdevTopic && d.night.webdevTopic.trim()) || d.night.hours>0;
    if(hrs>0 || hasDsa || hasWebdev) studied.add(iso);
    if(hasDsa) dsaDays.add(iso);
    if(hasWebdev) webdevDays.add(iso);
  });
  function streakFromSet(set){
    let cur=0, longest=0, run=0;
    // longest: walk all sorted studied days, count consecutive iso days
    const arr = [...set].sort();
    let prevDate=null;
    arr.forEach(iso=>{
      if(prevDate && daysBetween(prevDate, iso)===1){ run++; } else { run=1; }
      longest = Math.max(longest, run);
      prevDate = iso;
    });
    // current streak: walk backward from today
    let d = todayISO();
    if(!set.has(d)) d = addDays(d,-1); // allow today to be unfilled yet
    while(set.has(d)){ cur++; d = addDays(d,-1); }
    return {current:cur, longest};
  }
  return {
    overall: streakFromSet(studied),
    dsa: streakFromSet(dsaDays),
    webdev: streakFromSet(webdevDays),
    studiedSet: studied
  };
}

function computeTopicStrength(t){
  if(t.attempted===0) return null;
  return clamp(Math.round((t.independent*100 + t.hint*45 + t.full*5) / t.attempted),0,100);
}

function computeAIDependence(){
  let ind=0,hint=0,full=0;
  state.topics.forEach(t=>{ ind+=t.independent; hint+=t.hint; full+=t.full; });
  const total = ind+hint+full;
  return { ind, hint, full, total,
    indPct: pct(ind,total), hintPct: pct(hint,total), fullPct: pct(full,total) };
}

function todaysTotals(iso){
  const day = state.dailyLogs[iso];
  let attempted=0, independent=0, hint=0, full=0, hours=0;
  if(day){
    [...day.morning.entries, ...day.afternoon.entries].forEach(e=>{
      attempted += e.attempted||0; independent += e.independent||0; hint += e.hint||0; full += e.full||0;
    });
    hours = (day.morning.hours||0)+(day.afternoon.hours||0)+(day.night.hours||0);
  }
  return {attempted, independent, hint, full, hours};
}

function dsaProgressForDay(iso){
  const topics = scheduleFor(iso);
  if(topics.length===0) return 0;
  let score=0;
  topics.forEach(name=>{
    const s = topicStatusForDay(name, iso);
    if(s==="completed") score+=1; else if(s==="partial") score+=0.5;
  });
  return pct(score, topics.length);
}

function webdevProgressForDay(iso){
  const day = state.dailyLogs[iso];
  if(!day) return 0;
  if(day.night.entries.length>0) return 100;
  if(day.night.webdevTopic && day.night.webdevTopic.trim()) return 50;
  return 0;
}

function renderWeeklyReport(){
  const iso = todayISO();
  const start = addDays(iso, -6);
  const days = Array.from({length:7}).map((_,i)=>addDays(start,i));
  let hoursTotal=0, studiedDays=0, dsaDays=0, webdevDays=0;
  let attempted=0, ind=0, hint=0, full=0;
  const topicCompletion = {};
  days.forEach(d=>{
    const day = state.dailyLogs[d];
    if(!day) return;
    const hrs = (day.morning.hours||0)+(day.afternoon.hours||0)+(day.night.hours||0);
    hoursTotal += hrs;
    if(hrs>0) studiedDays++;
    if(day.morning.entries.length || day.afternoon.entries.length) dsaDays++;
    if(day.night.entries.length) webdevDays++;
    [...day.morning.entries, ...day.afternoon.entries].forEach(e=>{
      attempted+=e.attempted||0; ind+=e.independent||0; hint+=e.hint||0; full+=e.full||0;
      topicCompletion[e.topicName] = topicCompletion[e.topicName]||{attempted:0,independent:0};
      topicCompletion[e.topicName].attempted += e.attempted||0;
      topicCompletion[e.topicName].independent += e.independent||0;
    });
  });
  const weak = state.topics.map(t=>({t,strength:computeTopicStrength(t)})).filter(x=>x.strength!==null).sort((a,b)=>a.strength-b.strength).slice(0,3);
  const overdue = state.topics.filter(t=>t.nextRevision && t.nextRevision<=todayISO());

  return `
    <div class="grid grid-2">
      <div>
        <div class="kv"><span class="k">Days studied (last 7)</span><span class="v">${studiedDays}/7</span></div>
        <div class="kv"><span class="k">Total hours</span><span class="v">${hoursTotal.toFixed(1)}h</span></div>
        <div class="kv"><span class="k">Avg daily hours</span><span class="v">${(hoursTotal/7).toFixed(1)}h</span></div>
        <div class="kv"><span class="k">DSA consistency</span><span class="v">${pct(dsaDays,7)}%</span></div>
        <div class="kv"><span class="k">WebDev consistency</span><span class="v">${pct(webdevDays,7)}%</span></div>
      </div>
      <div>
        <div class="kv"><span class="k">Problems attempted</span><span class="v">${attempted}</span></div>
        <div class="kv"><span class="k">Independent</span><span class="v">${ind}</span></div>
        <div class="kv"><span class="k">Hint-assisted</span><span class="v">${hint}</span></div>
        <div class="kv"><span class="k">Solution-assisted</span><span class="v">${full}</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="section-title" style="font-size:13px;">Next Week's Focus</div>
    <div class="tmuted" style="margin-top:8px;font-size:13px;">
      ${weak.length? `Weakest topics: ${weak.map(w=>esc(w.t.name)+' ('+w.strength+'%)').join(', ')}.` : 'No weak-topic data yet.'}
      ${overdue.length? ` Overdue revisions: ${overdue.map(t=>esc(t.name)).join(', ')}.` : ''}
    </div>
  `;
}

/* ============================= CALENDAR ============================= */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-indexed

function dayQuality(iso){
  const day = state.dailyLogs[iso];
  if(!day) return null;
  const hrs = (day.morning.hours||0)+(day.afternoon.hours||0)+(day.night.hours||0);
  const hasEntries = day.morning.entries.length || day.afternoon.entries.length || day.night.entries.length;
  if(!hasEntries && hrs===0) return null;
  if(hrs>=6 || (day.morning.entries.length && day.afternoon.entries.length && day.night.entries.length)) return "good";
  if(hrs>0 || hasEntries) return "partial";
  return "missed";
}

function renderCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const iso = todayISO();

  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dIso = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const q = dayQuality(dIso);
    const cls = q ? q : (dIso < iso ? "missed" : "");
    const isToday = dIso===iso;
    cells += `<div class="cal-cell ${cls} ${isToday?'today-cell':''}" data-action="open-day" data-date="${dIso}">${d}</div>`;
  }

  const monthLabel = first.toLocaleDateString("en-US",{month:"long",year:"numeric"});

  return `
    <div class="page-head">
      <div><div class="page-title">Calendar</div><div class="page-sub">🟢 good day · 🟡 partial day · 🔴 missed day. Click a date to open its log.</div></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn ghost small" data-action="cal-prev">← prev</button>
        <div class="tname" style="font-family:var(--mono);">${monthLabel}</div>
        <button class="btn ghost small" data-action="cal-next">next →</button>
      </div>
    </div>
    <div class="card">
      <div class="cal-grid" style="margin-bottom:8px;">
        ${DOW_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  `;
}

  if(filterTopic) filterTopic.addEventListener("change", e=>{ problemFilter.topic = e.target.value; render(); });

  const logDatePicker = document.getElementById("logDatePicker");
  if(logDatePicker) logDatePicker.addEventListener("change", e=>{ logDate = e.target.value; render(); });
}

document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;

  switch(action){
    case "close-modal": closeModal(); break;

    case "goto-topics": setTab("topics"); break;

    /* --- topics --- */
    case "add-topic": openTopicModal(null); break;
    case "edit-topic": openTopicModal(btn.dataset.id); break;
    case "delete-topic": {
      if(confirm("Delete this topic? This won't delete related logs.")){
        state.topics = state.topics.filter(t=>t.id!==btn.dataset.id);
        persist(); toast("Topic deleted");
      }
      break;
    }
    case "save-topic": {
      const name = document.getElementById("mName").value.trim();
      if(!name){ toast("Topic name required"); return; }
      const weakness = document.getElementById("mWeak").value;
      const lastRevised = document.getElementById("mLastRev").value || null;
      const nextRevision = document.getElementById("mNextRev").value || null;
      const notes = document.getElementById("mNotes").value;
      const id = btn.dataset.id;
      if(id){
        const t = state.topics.find(x=>x.id===id);
        Object.assign(t, {name, weakness, lastRevised, nextRevision, notes});
      } else {
        state.topics.push({id:uid(), name, weakness, notes, attempted:0, independent:0, hint:0, full:0, lastRevised, nextRevision});
      }
      closeModal(); persist(); toast("Topic saved");
      break;
    }

    /* --- quick log --- */
    case "open-quicklog": openQuickLogModal(state.topics[0]?state.topics[0].name:"", null); break;
    case "quicklog-topic": openQuickLogModal(btn.dataset.topic || (state.topics[0]?state.topics[0].name:""), btn.dataset.session); break;
    case "save-quicklog": {
      const topicName = document.getElementById("qlTopic").value;
      const session = document.getElementById("qlSession").value;
      const revised = document.getElementById("qlRevised").checked;
      const attempted = parseInt(document.getElementById("qlAttempted").value)||0;
      const independent = parseInt(document.getElementById("qlIndependent").value)||0;
      const hint = parseInt(document.getElementById("qlHint").value)||0;
      const full = parseInt(document.getElementById("qlFull").value)||0;
      const notes = document.getElementById("qlNotes").value;

      const iso = todayISO();
      const day = ensureDay(iso);
      day[session].entries.push({id:uid(), topicName, revised, attempted, independent, hint, full, notes});

      const topic = state.topics.find(t=>t.name===topicName);
      if(topic){
        topic.attempted += attempted; topic.independent += independent; topic.hint += hint; topic.full += full;
        topic.lastRevised = iso;
      }
      closeModal(); persist(); toast(`${topicName} logged`);
      break;
    }

    /* --- webdev quick log (night) --- */
    case "open-webdevlog": openWebdevLogModal(); break;
    case "save-webdevlog": {
      const iso = btn.dataset.date || todayISO();
      const day = ensureDay(iso);
      const topicText = document.getElementById("wlTopic").value.trim();
      const built = document.getElementById("wlBuilt").value.trim();
      const aiUsage = document.getElementById("wlAI").value;
      const hours = parseFloat(document.getElementById("wlHours").value)||0;
      day.night.webdevTopic = topicText;
      day.night.built = built;
      day.night.aiUsage = aiUsage;
      day.night.hours = hours;
      day.night.entries.push({id:uid(), summary: built || topicText, aiUsage});
      const wt = state.webdevTopics.find(t=>t.name.toLowerCase()===topicText.toLowerCase());
      if(wt){ wt.practiced = true; if(built) wt.built = true; wt.lastPracticed = iso; }
      closeModal(); persist(); toast("WebDev session logged");
      break;
    }
    case "save-night-topic": {
      const iso = todayISO();
      const day = ensureDay(iso);
      day.night.webdevTopic = document.getElementById("nightTopicInput").value;
      persist(); toast("Saved");
      break;
    }

    /* --- problems --- */
    case "add-problem": openProblemModal(null); break;
    case "edit-problem": openProblemModal(btn.dataset.id); break;
    case "delete-problem": {
      if(confirm("Delete this problem?")){
        state.problems = state.problems.filter(p=>p.id!==btn.dataset.id);
        persist(); toast("Problem deleted");
      }
      break;
    }
    case "save-problem": {
      const name = document.getElementById("pName").value.trim();
      if(!name){ toast("Problem name required"); return; }
      const data = {
        name,
        topicId: document.getElementById("pTopic").value || null,
        difficulty: document.getElementById("pDifficulty").value,
        platform: document.getElementById("pPlatform").value,
        url: document.getElementById("pUrl").value,
        date: document.getElementById("pDate").value || todayISO(),
        timeTaken: document.getElementById("pTime").value,
        status: document.getElementById("pStatus").value,
        approach: document.getElementById("pApproach").value,
        mistake: document.getElementById("pMistake").value,
        notes: document.getElementById("pNotes").value,
        revisit: document.getElementById("pRevisit").checked,
        nextRevisionDate: document.getElementById("pRevisitDate").value || null
      };
      const id = btn.dataset.id;
      if(id){
        Object.assign(state.problems.find(p=>p.id===id), data);
      } else {
        state.problems.push(Object.assign({id:uid()}, data));
      }
      closeModal(); persist(); toast("Problem saved");
      break;
    }

    /* --- revisit --- */
    case "resolve-revisit": {
      const p = state.problems.find(x=>x.id===btn.dataset.id);
      if(p){
        p.status = "independent";
        p.revisit = false;
        p.date = todayISO();
        const topic = state.topics.find(t=>t.id===p.topicId);
        if(topic){ topic.independent += 1; topic.attempted += 1; topic.lastRevised = todayISO(); }
        persist(); toast("Marked re-solved independently 🎉");
      }
      break;
    }

    /* --- schedule --- */
    case "add-sched-topic": {
      const day = btn.dataset.day;
      const input = document.querySelector(`[data-sched-input="${day}"]`);
      const val = input.value.trim();
      if(val){
        state.schedule[day] = state.schedule[day] || [];
        state.schedule[day].push(val);
        persist();
      }
      break;
    }
    case "remove-sched-topic": {
      const day = btn.dataset.day, idx = parseInt(btn.dataset.idx);
      state.schedule[day].splice(idx,1);
      persist();
      break;
    }

    /* --- webdev topics --- */
    case "add-webdev": openWebdevTopicModal(null); break;
    case "edit-webdev": openWebdevTopicModal(btn.dataset.id); break;
    case "delete-webdev": {
      if(confirm("Delete this WebDev topic?")){
        state.webdevTopics = state.webdevTopics.filter(t=>t.id!==btn.dataset.id);
        persist(); toast("Deleted");
      }
      break;
    }
    case "save-webdev-topic": {
      const name = document.getElementById("wName").value.trim();
      if(!name){ toast("Name required"); return; }
      const data = {
        name,
        learned: document.getElementById("wLearned").checked,
        practiced: document.getElementById("wPracticed").checked,
        built: document.getElementById("wBuilt").checked,
        confidence: parseInt(document.getElementById("wConfidence").value)||1,
        lastPracticed: document.getElementById("wLastPrac").value || null,
        nextRevision: document.getElementById("wNextRev").value || null,
        notes: document.getElementById("wNotes").value
      };
      const id = btn.dataset.id;
      if(id) Object.assign(state.webdevTopics.find(t=>t.id===id), data);
      else state.webdevTopics.push(Object.assign({id:uid()}, data));
      closeModal(); persist(); toast("Saved");
      break;
    }

    /* --- projects --- */
    case "add-project": openProjectModal(null); break;
    case "edit-project": openProjectModal(btn.dataset.id); break;
    case "delete-project": {
      if(confirm("Delete this project?")){
        state.projects = state.projects.filter(p=>p.id!==btn.dataset.id);
        persist(); toast("Deleted");
      }
      break;
    }
    case "save-project": {
      const name = document.getElementById("prName").value.trim();
      if(!name){ toast("Project name required"); return; }
      const id = btn.dataset.id;
      const featureLines = document.getElementById("prFeatures").value.split("\n").map(s=>s.trim()).filter(Boolean);
      let features;
      if(id){
        const existing = state.projects.find(p=>p.id===id);
        features = featureLines.map(text=>{
          const match = existing.features.find(f=>f.text===text);
          return match ? match : {text, done:false};
        });
      } else {
        features = featureLines.map(text=>({text, done:false}));
      }
      const data = {
        name,
        description: document.getElementById("prDesc").value,
        tech: document.getElementById("prTech").value.split(",").map(s=>s.trim()).filter(Boolean),
        startDate: document.getElementById("prStart").value,
        status: document.getElementById("prStatus").value,
        features,
        bugs: document.getElementById("prBugs").value,
        notes: document.getElementById("prNotes").value
      };
      if(id) Object.assign(state.projects.find(p=>p.id===id), data);
      else state.projects.push(Object.assign({id:uid()}, data));
      closeModal(); persist(); toast("Project saved");
      break;
    }
    case "toggle-feature": {
      const p = state.projects.find(x=>x.id===btn.dataset.id);
      const idx = parseInt(btn.dataset.idx);
      p.features[idx].done = btn.checked;
      persist();
      break;
    }

    /* --- daily log nav --- */
    case "log-prev-day": logDate = addDays(logDate, -1); render(); break;
    case "log-next-day": logDate = addDays(logDate, 1); render(); break;
    case "save-log-day": {
      const day = ensureDay(logDate);
      day.morning.hours = parseFloat(document.getElementById("morningHours").value)||0;
      day.afternoon.hours = parseFloat(document.getElementById("afternoonHours").value)||0;
      day.night.hours = parseFloat(document.getElementById("nightHours").value)||0;
      day.reflection.learned = document.getElementById("refLearned").value;
      day.reflection.difficult = document.getElementById("refDifficult").value;
      day.reflection.revisit = document.getElementById("refRevisit").value;
      day.reflection.tomorrow = document.getElementById("refTomorrow").value;
      persist(); toast("Log saved");
      break;
    }

    /* --- calendar --- */
    case "cal-prev": calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); break;
    case "cal-next": calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); break;
    case "open-day": {
      logDate = btn.dataset.date;
      setTab("log");
      break;
    }
    case "retry-sync": {
      toast("Retrying sync…");
      reloadAndReconcile();
      break;
    }
    case "export-data": {
      exportData();
      break;
    }
    case "import-data": {
      document.getElementById("importFileInput").click();
      break;
    }
  }
});

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `dsa-webdev-tracker-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Backup downloaded ⬇");
}

(function initImportHandler(){
  const input = document.getElementById("importFileInput");
  if(input){
    input.addEventListener("change", async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const text = await file.text();
        const parsed = JSON.parse(text);
        if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.topics)){
          toast("That doesn't look like a valid backup file.");
          return;
        }
        if(!confirm("Import this backup? It will replace everything currently in the app.")) return;
        state = Object.assign(defaultState(), parsed);
        if(!state.schedule) state.schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
        if(!state.dailyLogs) state.dailyLogs = {};
        if(!state.ui) state.ui = {lastTab:"dashboard"};
        activeTab = state.ui.lastTab || "dashboard";
        render();
        saveState();
        toast("Backup imported ✓");
      }catch(err){
        console.error("Import failed:", err);
        toast("Couldn't read that file — make sure it's a JSON backup from this app.");
      }
      input.value = "";
    });
  }
})();

/* Manual retry: re-push whatever is currently in memory so nothing on screen gets lost or overwritten by a stale remote copy. */
async function reloadAndReconcile(){
  await attemptSave(1);
}

/* checkbox change events (not click-based reliably on some browsers, but click covers most; add change too) */
document.addEventListener("change", function(e){
  const el = e.target;
  if(el.dataset && el.dataset.action === "toggle-feature"){
    const p = state.projects.find(x=>x.id===el.dataset.id);
    const idx = parseInt(el.dataset.idx);
    p.features[idx].done = el.checked;
    persist();
  }
});

/* ============================= INIT ============================= */
async function init(){
  await loadState();
  activeTab = state.ui.lastTab || "dashboard";
  document.getElementById("loadingScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  if(!usingApi()){
    console.info("No CONFIG.API_BASE_URL set — using Claude's built-in artifact storage. See tracker-backend/README.md to switch to your own MongoDB.");
  }
  render();
}

init();

})();
</script>
